name: Rust migration trials
on:
  push:
    branches: [exp/rust-pipeline]
    paths: ['cpp/**', 'build.sh', 'tools/migration-trials.sh', '.github/workflows/migration-trials.yml']
permissions:
  contents: read
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      TRIAL_START: d8af8807e41f464a8447abc4dc2500df7dd15e0a
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: ./.github/actions/prepare-gate
      - run: bash tools/migration-trials.sh
